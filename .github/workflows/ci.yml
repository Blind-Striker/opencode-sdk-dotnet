name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - LICENSE
  pull_request:
    branches:
      - master
      - "feature/*"
    # GitHub evaluates the cumulative PR diff. A docs-only follow-up to an already-green
    # mixed PR uses [skip ci] in its commit message instead of rerunning this matrix.
    paths-ignore:
      - "**.md"
      - LICENSE

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: "Build & Test (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows

          - os: ubuntu-24.04
            name: Linux

          - os: macos-15
            name: macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          # SDK version comes from the repo pin; 8.x/9.x are additionally installed so their
          # runtimes are present for the net8.0/net9.0 test legs.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Bun (pinned server runtime)
        uses: oven-sh/setup-bun@v2
        with:
          # The pin's own packageManager row (external/opencode/package.json).
          bun-version: 1.3.14

      # fs.find uses upstream's ripgrep resolver. Keep the simulated server offline by placing the
      # exact resolver version on the job PATH before tests instead of allowing its runtime download.
      - name: Provision ripgrep for pinned server
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $version = "15.1.0"
          switch ("${{ runner.os }}-${{ runner.arch }}") {
            "Windows-X64" {
              $archive = "ripgrep-$version-x86_64-pc-windows-msvc.zip"
              $sha256 = "124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a"
            }
            "Linux-X64" {
              $archive = "ripgrep-$version-x86_64-unknown-linux-musl.tar.gz"
              $sha256 = "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599"
            }
            "macOS-ARM64" {
              $archive = "ripgrep-$version-aarch64-apple-darwin.tar.gz"
              $sha256 = "378e973289176ca0c6054054ee7f631a065874a352bf43f0fa60ef079b6ba715"
            }
            default { throw "Unsupported ripgrep runner: ${{ runner.os }}-${{ runner.arch }}" }
          }

          $download = Join-Path $env:RUNNER_TEMP $archive
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/$version/$archive" -OutFile $download
          $actual = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $sha256) {
            throw "ripgrep archive digest mismatch: expected $sha256, received $actual"
          }

          $toolRoot = Join-Path $env:RUNNER_TEMP "ripgrep-$version-${{ runner.os }}-${{ runner.arch }}"
          $null = New-Item -ItemType Directory -Path $toolRoot
          if ($archive.EndsWith(".zip", [StringComparison]::Ordinal)) {
            Expand-Archive -LiteralPath $download -DestinationPath $toolRoot
          } else {
            tar -xzf $download -C $toolRoot
          }

          $executableName = if ($IsWindows) { "rg.exe" } else { "rg" }
          $executables = @(Get-ChildItem -LiteralPath $toolRoot -Recurse -File -Filter $executableName)
          if ($executables.Count -ne 1) {
            throw "Expected exactly one $executableName in $archive, found $($executables.Count)"
          }

          $executable = $executables[0].FullName
          Split-Path -Parent $executable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & $executable --version

      - name: Cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('external/opencode/bun.lock') }}

      # --ignore-scripts skips the root postinstall, which repairs the separate Node PTY
      # implementation. Normal PTYs in this lane use Bun's bun-pty implementation.
      - name: Install pinned server dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: external/opencode

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj', '**/dotnet-tools.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore local tools
        if: runner.os == 'Linux'
        run: dotnet tool restore

      - name: Detect slop
        if: runner.os == 'Linux'
        run: dotnet tool run slopwatch analyze --exclude ".scratchpad/**,external/**" --fail-on warning

      - name: Build
        run: dotnet build --configuration Release

      # Physical formatting gate (one leg is enough — results are OS-independent). This retains
      # encoding/EOL/whitespace without rerunning the semantic analyzer set.
      - name: Verify formatting
        if: runner.os == 'Linux'
        run: dotnet format whitespace --verify-no-changes --no-restore

      # Build owns compiler/CA/third-party diagnostics. This pass retains all warning-level Roslyn
      # style rules plus import organization, including rules Roslyn cannot enforce during build.
      - name: Verify code style
        if: runner.os == 'Linux'
        run: dotnet format style --verify-no-changes --no-restore --severity warn

      # Smoke-runs the repo tooling entry; exercises the committed executable bit and the
      # shebang, which only take effect on a Linux checkout.
      - name: Tooling entry smoke
        if: runner.os == 'Linux'
        run: ./tools/opencode-tool.cs --help

      # Regenerating the pinned profile must be a byte-identical no-op on a clean checkout.
      - name: Verify generated output
        if: runner.os == 'Linux'
        run: dotnet run --file tools/opencode-tool.cs -- generate --verify

      # TUnit's always-on HTML report self-uploads as a workflow artifact, but only if these
      # runtime vars (normally JS/Docker-action-only) are re-exported to run steps.
      - name: Enable TUnit report artifact upload
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: Test
        run: dotnet test --configuration Release --no-build -- --report-trx --results-directory "${{ github.workspace }}/test-results"
        env:
          TUNIT_ARTIFACT_RETENTION_DAYS: 7

      - name: Publish test results
        id: test-results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        # Allow fork PRs to fail gracefully (permission error) without breaking the workflow.
        continue-on-error: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        with:
          name: "Test Results (${{ matrix.name }})"
          path: "test-results/**/*.trx"
          reporter: dotnet-trx
          path-replace-backslashes: true
          fail-on-error: true

      # Badge posting failure must not fail CI: the badgesmith.cs tool exits 0 on a failed post
      # unless --fail-on-error is passed (which this action never does), and continue-on-error
      # here is defense in depth against pre-flight validation failures. always() plus the
      # ref/event guard mirrors badge-smith's own ci-cd.yml so a failing master run still posts
      # the (failing) counts instead of leaving the badge stale.
      # GitHub Actions treats any remote reference under .github/workflows/ as a REUSABLE
      # WORKFLOW and refuses it inside steps ("reusable workflows should be referenced at the
      # top-level jobs.*.uses key"), so the composite action cannot be consumed remotely from its
      # current home. Until badge-smith relocates it (e.g. .github/actions/) and re-tags, we check
      # the pinned tag out and consume the action through the local-path form badge-smith itself
      # uses; the action is github.action_path-relative, so the relocated checkout is
      # self-contained.
      - name: Checkout BadgeSmith action
        if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: localstack-dotnet/badge-smith
          # Pinned to the commit the live api.localstackfor.net deployment runs, keeping the
          # signing tool and the server in lockstep. (The 2026-08-31 401s were ultimately a
          # corrupted repository secret, not the tag - but deploy-aligned pinning stays the
          # safer default until badge-smith tags releases in lockstep with its deployments.)
          ref: f3ab12b93c9d55cb27c467945504ca90c87b3eed
          path: .badge-smith

      - name: Update test badge via BadgeSmith API
        if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push'
        continue-on-error: true
        uses: ./.badge-smith/.github/workflows/update-test-badge
        with:
          platform: ${{ matrix.name }}
          test_passed: '${{ steps.test-results.outputs.passed || 0 }}'
          test_failed: '${{ steps.test-results.outputs.failed || 0 }}'
          test_skipped: '${{ steps.test-results.outputs.skipped || 0 }}'
          test_url_html: ${{ steps.test-results.outputs.url_html || '' }}
          commit_sha: '${{ github.sha }}'
          run_id: '${{ github.run_id }}'
          repository: '${{ github.repository }}'
          server_url: '${{ github.server_url }}'
          api_base_url: 'https://api.localstackfor.net'
          hmac_secret: '${{ secrets.TESTDATASECRET }}'

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          name: test-results-${{ matrix.name }}-${{ github.event.pull_request.number || github.run_number }}
          path: test-results/**
          retention-days: 7

  # Runs once green (needs the matrixed build-and-test job, which GitHub Actions only satisfies
  # once every OS leg completes) and only on a real push to master, never on a PR. Publishes a
  # -nightly package to GitHub Packages so the exact code at HEAD is always installable; the
  # stable, human-triggered lane lives in publish-nuget.yml.
  publish-nightly:
    name: "Publish nightly (GitHub Packages)"
    needs: [build-and-test]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # No submodules: GenerationRequest.RepositoryDefault (tools/OpenCode.Sdk.Tools/Generator/
      # GenerationRequest.cs) points generate --verify at spec/openapi.json, tools/curation.json,
      # and tools/generation-profile.txt — all committed. Packing builds only src/OpenCode.Sdk and
      # src/OpenCode.Sdk.Extensions, which never reference external/opencode; that submodule is a
      # test-only fixture the release lane does not exercise.
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Two-layer defense against a partial generated surface (Directory.Build.targets' header
      # comment): that target refuses to pack on a missing or stale .generation-incomplete marker,
      # and this step additionally reruns the generator in --verify mode first, so a hand-edited or
      # stale marker is caught by regeneration rather than only by the marker's own text.
      - name: Verify generated output
        run: dotnet run --file tools/opencode-tool.cs -- generate --verify

      - name: Compute nightly version suffix
        id: version
        run: echo "suffix=nightly.$(date -u +%Y%m%d).${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: dotnet pack --configuration Release --version-suffix "${{ steps.version.outputs.suffix }}" --output packages

      # dotnet nuget push implements its own glob expansion; the path is quoted so the shell does
      # not expand it first (two packable projects produce two .nupkg files here).
      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "packages/*.nupkg"
          --source https://nuget.pkg.github.com/Blind-Striker/index.json
          --api-key ${{ secrets.GITHUB_TOKEN }}
          --skip-duplicate
