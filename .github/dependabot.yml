version: 2
updates:
  # Central Package Management holds every version in Directory.Packages.props, so a NuGet update
  # is a one-file change. Analyzers move together to keep the wall's arbitration reviewable in one
  # place rather than across five separate pull requests.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      analyzers:
        patterns:
          - "*Analyzer*"
          - "Roslynator.*"
          - "SonarAnalyzer.*"
          - "Meziantou.*"

  # The workflows pin third-party actions by commit SHA; this is what keeps those pins current
  # instead of frozen.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
